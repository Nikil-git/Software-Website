
name: Build Physics Software EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install PyQt6 numpy opencv-python sounddevice imageio-ffmpeg pyinstaller

      - name: Verify source
        run: |
          if (!(Test-Path "Software.py")) {
            Write-Error "Software.py was not found."
            exit 1
          }
          python -m py_compile Software.py

      - name: Build executable
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name PhysicsSoftware --collect-all PyQt6 --collect-all cv2 --collect-all sounddevice --collect-all imageio_ffmpeg Software.py

      - name: Publish direct EXE download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Physics Software
          body: Latest Windows build of Physics Software.
          target_commitish: main
          files: dist/PhysicsSoftware.exe
          overwrite_files: true


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#080b12">
    <title>Physics Workbench</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: #080b12;
            color: #e5e7eb;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        .container {
            width: 100%;
            max-width: 680px;
            text-align: center;
        }

        .download-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 16px 28px;
            border-radius: 9px;
            background: #38bdf8;
            color: #06111a;
            font-size: 16px;
            font-weight: 700;
            text-decoration: none;
            transition: background 0.2s, transform 0.2s;
        }

        .download-button:hover {
            background: #7dd3fc;
            transform: translateY(-2px);
        }

        .download-button svg {
            width: 20px;
            height: 20px;
        }

        .receipt {
            display: none;
            max-width: 420px;
            margin: 30px auto 0;
            padding: 24px;
            border: 1px solid #1e293b;
            border-radius: 12px;
            background: #0d1420;
            text-align: left;
        }

        .receipt h2 {
            margin-bottom: 6px;
            color: #38bdf8;
            font-size: 20px;
        }

        .receipt p {
            margin-top: 10px;
            color: #94a3b8;
            font-size: 13px;
        }

        .receipt-row {
            display: flex;
            justify-content: space-between;
            gap: 16px;
            padding: 11px 0;
            border-bottom: 1px solid #1e293b;
            font-size: 13px;
        }

        .receipt-row span:first-child {
            color: #64748b;
        }

        .receipt-row span:last-child {
            color: #e2e8f0;
            text-align: right;
        }

        .receipt-status {
            margin-top: 18px;
            color: #4ade80;
            font-size: 12px;
            font-weight: 600;
        }

        .print-button {
            width: 100%;
            margin-top: 20px;
            padding: 11px;
            border: 1px solid #334155;
            border-radius: 7px;
            background: transparent;
            color: #e2e8f0;
            cursor: pointer;
        }

        .print-button:hover {
            background: #1e293b;
        }

        @media print {
            body {
                background: white;
                color: black;
            }

            .download-button,
            .print-button {
                display: none;
            }

            .receipt {
                display: block !important;
                border: 1px solid #ccc;
                background: white;
            }

            .receipt h2,
            .receipt-row span:last-child,
            .receipt-status {
                color: black;
            }

            .receipt p,
            .receipt-row span:first-child {
                color: #555;
            }
        }
    </style>
</head>

<body>
    <main class="container">
        <a
            class="download-button"
            id="downloadButton"
            href="https://github.com/Nikil-git/Software-Website/releases/download/tag/PhysicsSoftware.exe"
        >
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                <path d="m7 10 5 5 5-5"/>
                <path d="M12 15V3"/>
            </svg>
            Download for Windows
        </a>

        <section class="receipt" id="receipt">
            <h2>Download Receipt</h2>
            <p>Physics Workbench — Wacom Ready</p>

            <div class="receipt-row">
                <span>Receipt ID</span>
                <span id="receiptId"></span>
            </div>

            <div class="receipt-row">
                <span>Application</span>
                <span>Physics Workbench</span>
            </div>

            <div class="receipt-row">
                <span>Version</span>
                <span>Latest Release</span>
            </div>

            <div class="receipt-row">
                <span>Platform</span>
                <span>Windows</span>
            </div>

            <div class="receipt-row">
                <span>Download date</span>
                <span id="downloadDate"></span>
            </div>

            <div class="receipt-row">
                <span>Payment</span>
                <span>Free download</span>
            </div>

            <div class="receipt-status">Download initiated</div>

            <button class="print-button" onclick="window.print()">
                Print / Save Receipt
            </button>
        </section>
    </main>

    <script>
        const downloadButton = document.getElementById("downloadButton");
        const receipt = document.getElementById("receipt");

        downloadButton.addEventListener("click", () => {
            const now = new Date();
            const receiptNumber = "PWB-" + now.getTime();

            document.getElementById("receiptId").textContent = receiptNumber;
            document.getElementById("downloadDate").textContent =
                now.toLocaleString();

            receipt.style.display = "block";
        });
    </script>
</body>
</html>
